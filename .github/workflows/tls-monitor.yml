name: AirfryerGuide TLS-Monitor

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: afg-tls-monitor
  cancel-in-progress: false

jobs:
  tls-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: TLS-Verbindungen messen und AFG informieren
        env:
          AFG_MONITOR_TOKEN: ${{ secrets.AFG_MONITOR_TOKEN }}
        run: python3 monitor_tls.py
